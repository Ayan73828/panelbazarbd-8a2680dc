name: Build Panel Bazar BD APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/panel-bazar-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug

      - name: Package APK into ZIP
        run: |
          mkdir -p release-package
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release-package/Panel-Bazar-BD.apk
          printf '%s\n' 'Panel Bazar BD Android app. Install Panel-Bazar-BD.apk on your Android device.' > release-package/README.txt
          cd release-package
          zip -9 ../Panel-Bazar-BD-APK.zip Panel-Bazar-BD.apk README.txt

      - name: Upload APK and ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panel-bazar-bd-apk-package
          path: |
            Panel-Bazar-BD.apk
            Panel-Bazar-BD-APK.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Panel Bazar BD APK (Latest)
          body: "Latest Android APK for Panel Bazar BD. This is a debug-signed build for direct testing."
          prerelease: true
          make_latest: false
          files: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            Panel-Bazar-BD-APK.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
