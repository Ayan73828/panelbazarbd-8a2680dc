name: Build Panel Bazar BD APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/panel-bazar-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate launcher icons from official logo
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from urllib.request import urlopen
          from PIL import Image, ImageOps
          from io import BytesIO
          from pathlib import Path
          url = "https://cdn.phototourl.com/member/2026-10-18-95f8a910-7c5e-4ec3-a35c-a352f0d7532c.png"
          with urlopen(url, timeout=30) as response:
              logo = Image.open(BytesIO(response.read())).convert("RGBA")
          # Preserve the complete official logo on a square transparent canvas.
          logo.thumbnail((192, 192), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (192, 192), (0, 0, 0, 0))
          canvas.alpha_composite(logo, ((192-logo.width)//2, (192-logo.height)//2))
          for folder, size in [("mipmap-mdpi",48),("mipmap-hdpi",72),("mipmap-xhdpi",96),("mipmap-xxhdpi",144),("mipmap-xxxhdpi",192)]:
              out = Path("android-app/app/src/main/res") / folder
              out.mkdir(parents=True, exist_ok=True)
              canvas.resize((size,size), Image.Resampling.LANCZOS).save(out / "ic_launcher.png")
          print(f"Generated launcher icons from official logo ({logo.width}x{logo.height})")
          PY

      - name: Build signed release APK
        working-directory: android-app
        run: gradle assembleRelease

      - name: Prepare branded APK filename
        run: cp android-app/app/build/outputs/apk/release/app-release.apk Panel-Bazar-BD.apk

      - name: Verify APK signature and package metadata
        run: |
          APK_PATH=Panel-Bazar-BD.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK_PATH"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK_PATH" | head -n 5
          test "$(stat -c%s "$APK_PATH")" -gt 10000

      - name: Package APK into ZIP
        run: |
          mkdir -p release-package
          cp Panel-Bazar-BD.apk release-package/Panel-Bazar-BD.apk
          printf '%s\n' 'Panel Bazar BD Android app. Install Panel-Bazar-BD.apk on your Android device.' > release-package/README.txt
          cd release-package
          zip -9 ../Panel-Bazar-BD-APK.zip Panel-Bazar-BD.apk README.txt

      - name: Upload APK and ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panel-bazar-bd-apk-package
          path: |
            Panel-Bazar-BD.apk
            Panel-Bazar-BD-APK.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Panel Bazar BD APK (Latest)
          body: "Latest Android APK for Panel Bazar BD. This is the branded Panel-Bazar-BD.apk release build."
          prerelease: true
          make_latest: false
          files: |
            Panel-Bazar-BD.apk
            Panel-Bazar-BD-APK.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
