name: Customer Agent chat auto-close

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  close-expired-chats:
    runs-on: ubuntu-latest
    steps:
      - name: Close unanswered chats older than 10 minutes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || (echo "Missing repository secret CRON_SECRET" && exit 1)
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://panelbazarbd-8a2680dc.onrender.com/api/internal/expire-agent-chats"
