plugins {
    id 'com.android.application'
}

android {
    namespace 'com.panelbazarbd.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.panelbazarbd.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            // Use Gradle's generated debug key for this test distribution build.
            // Replace with a private, securely stored release key before production.
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
